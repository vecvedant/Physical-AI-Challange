# Arduino CLI sketch profile for the UNO Q's STM32U585.
#
# The FQBN and the library set match what App Lab installs for a Bridge-enabled
# sketch; pinning them here means the MCU half builds reproducibly from the CLI
# without App Lab having to be open.
profiles:
  default:
    fqbn: arduino:zephyr:unoq
    platforms:
      - platform: arduino:zephyr
    libraries:
      - MsgPack (0.4.2)
      - DebugLog (0.8.4)
      - ArxContainer (0.7.0)
      - ArxTypeTraits (0.3.1)
default_profile: default
